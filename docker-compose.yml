services:
  order-match-engine:
    build: .
    command:
      - -address=:50051
      - -observability-address=:9090
      - -data-dir=/var/lib/order-match-engine
    ports:
      - "50051:50051"
      - "9090:9090"
    volumes:
      - engine-data:/var/lib/order-match-engine

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_match
      POSTGRES_USER: order_match
      POSTGRES_PASSWORD: order_match
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_match -d order_match"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/000001_projections.up.sql:/docker-entrypoint-initdb.d/000001_projections.up.sql:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - order-match-engine

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  engine-data:
  postgres-data:
  prometheus-data:
  grafana-data:
