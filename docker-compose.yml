services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_match
      POSTGRES_USER: order_match
      POSTGRES_PASSWORD: order_match
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_match -d order_match"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/000001_projections.up.sql:/docker-entrypoint-initdb.d/000001_projections.up.sql:ro

volumes:
  postgres-data:
