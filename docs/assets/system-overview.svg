<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Order Matching Engine system overview</title>
  <desc id="description">A client sends gRPC commands through a symbol router to independent single-writer engines and order books. Commands are persisted to replicated logs before mutation, projected asynchronously to PostgreSQL, and observed through Prometheus and Grafana.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label { fill: #e2e8f0; font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .detail { fill: #94a3b8; font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .chip { fill: #cbd5e1; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .04em; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #475569; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .node { fill: #111c31; stroke: #334155; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="630" rx="24" fill="url(#background)"/>
  <circle cx="1080" cy="40" r="180" fill="#4f46e5" opacity="0.08"/>
  <circle cx="80" cy="610" r="220" fill="#0891b2" opacity="0.07"/>

  <text x="60" y="70" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" font-weight="700">Order Matching Engine</text>
  <text x="60" y="101" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Deterministic matching · durable recovery · observable operations</text>
  <rect x="60" y="119" width="320" height="4" rx="2" fill="url(#accent)"/>

  <path class="line" d="M210 235 H280"/>
  <path class="line" d="M430 235 H500"/>
  <path class="line" d="M660 235 H730"/>
  <path class="line" d="M900 235 H970"/>

  <g filter="url(#shadow)">
    <rect class="node" x="60" y="180" width="150" height="110" rx="16"/>
    <rect x="77" y="197" width="38" height="38" rx="9" fill="#164e63"/>
    <path d="M87 226h18M90 207h12M93 213h6" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
    <text class="label" x="77" y="259">Clients</text>
    <text class="detail" x="77" y="279">commands · queries</text>

    <rect class="node" x="280" y="180" width="150" height="110" rx="16"/>
    <rect x="297" y="197" width="52" height="27" rx="13" fill="#312e81"/>
    <text x="323" y="216" text-anchor="middle" fill="#c7d2fe" font-family="sans-serif" font-size="13" font-weight="700">v1</text>
    <text class="label" x="297" y="259">gRPC API</text>
    <text class="detail" x="297" y="279">validation · streams</text>

    <rect class="node" x="500" y="180" width="160" height="110" rx="16"/>
    <circle cx="523" cy="216" r="6" fill="#22d3ee"/>
    <circle cx="545" cy="207" r="6" fill="#818cf8"/>
    <circle cx="545" cy="225" r="6" fill="#818cf8"/>
    <path d="M529 213l10-4M529 219l10 4" stroke="#64748b" stroke-width="2"/>
    <text class="label" x="517" y="259">Symbol router</text>
    <text class="detail" x="517" y="279">isolated per symbol</text>

    <rect x="730" y="160" width="170" height="150" rx="18" fill="#111c31" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="747" y="178" width="136" height="31" rx="8" fill="#0e7490" opacity="0.55"/>
    <text x="815" y="199" text-anchor="middle" fill="#cffafe" font-family="sans-serif" font-size="14" font-weight="700">BTC-USD</text>
    <text class="label" x="747" y="243">Single writer</text>
    <text class="detail" x="747" y="267">bounded FIFO queue</text>
    <text class="detail" x="747" y="289">one owning goroutine</text>

    <rect class="node" x="970" y="180" width="170" height="110" rx="16"/>
    <path d="M990 206h56M990 216h42M990 226h49" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
    <text class="label" x="987" y="259">Order book</text>
    <text class="detail" x="987" y="279">price · time · FIFO</text>
  </g>

  <path class="line" d="M815 310 V367"/>
  <path class="line" d="M815 422 H945"/>
  <path class="dash" d="M730 394 H625"/>
  <path class="dash" d="M500 422 H400"/>

  <g filter="url(#shadow)">
    <rect class="node" x="690" y="367" width="250" height="100" rx="16"/>
    <text class="label" x="710" y="402">Replicated event logs</text>
    <text class="detail" x="710" y="427">checksum + fsync before mutation</text>
    <text class="detail" x="710" y="449">snapshot + deterministic replay</text>

    <rect class="node" x="945" y="367" width="195" height="100" rx="16"/>
    <text class="label" x="965" y="402">Market data</text>
    <text class="detail" x="965" y="427">snapshot + deltas</text>
    <text class="detail" x="965" y="449">gap detection</text>

    <rect class="node" x="400" y="367" width="225" height="100" rx="16"/>
    <text class="label" x="420" y="402">Async projector</text>
    <text class="detail" x="420" y="427">idempotent replay</text>
    <text class="detail" x="420" y="449">checkpointed transactions</text>

    <rect class="node" x="175" y="367" width="225" height="100" rx="16"/>
    <text class="label" x="195" y="402">PostgreSQL</text>
    <text class="detail" x="195" y="427">orders · history · trades</text>
    <text class="detail" x="195" y="449">eventually consistent</text>

    <rect class="node" x="690" y="505" width="300" height="70" rx="16"/>
    <text class="label" x="710" y="536">Prometheus + Grafana</text>
    <text class="detail" x="710" y="559">latency · throughput · queues · books</text>
  </g>

  <g>
    <rect x="60" y="521" width="78" height="34" rx="17" fill="#0f2d3a" stroke="#155e75"/>
    <text class="chip" x="99" y="543" text-anchor="middle">GO</text>
    <rect x="150" y="521" width="84" height="34" rx="17" fill="#1e1b4b" stroke="#4338ca"/>
    <text class="chip" x="192" y="543" text-anchor="middle">gRPC</text>
    <rect x="246" y="521" width="126" height="34" rx="17" fill="#172554" stroke="#1d4ed8"/>
    <text class="chip" x="309" y="543" text-anchor="middle">POSTGRES</text>
    <rect x="384" y="521" width="126" height="34" rx="17" fill="#3b1d12" stroke="#c2410c"/>
    <text class="chip" x="447" y="543" text-anchor="middle">PROMETHEUS</text>
  </g>

  <text x="60" y="600" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Durability on the write path. Parallelism between instruments. Infrastructure outside the matching core.</text>
</svg>
